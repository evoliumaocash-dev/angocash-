<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sacar – Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Reset e Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Nunito Sans', sans-serif;
      color: white;
    }

    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      overflow-y: auto; /* Permite scroll se o conteúdo crescer */
      display: flex;
      flex-direction: column;
      background: #0a0a0a url('assets/img/bg.jpg') center/cover no-repeat;
    }

    /* Overlay para legibilidade */
    .phone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(10,10,10,0.95) 100%);
      z-index: 1;
    }

    /* Elementos Flutuantes (Z-index 2) */
    .topbar, .balance-card, .content, .footer { position: relative; z-index: 2; }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 25px 20px 10px;
    }

    .back-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .topbar-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* ── Cartão de Saldo (Estilo Premium) ── */
    .balance-card {
      margin: 15px 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      padding: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .balance-label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 5px;
    }

    .balance-amount {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: #f5c842; /* Dourado */
      display: block;
    }

    .balance-sub {
      font-size: 0.75rem;
      color: #4ade80; /* Verde sucesso */
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 10px;
    }

    /* ── Conteúdo Principal ── */
    .content {
      padding: 0 20px;
      flex: 1;
    }

    .input-group {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 8px;
      display: block;
    }

    /* Botão de Saque */
    .btn-withdraw {
      width: 100%;
      padding: 20px;
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      border: none;
      border-radius: 18px;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      transition: all 0.3s ease;
    }
    
    /* Estilo para quando o botão estiver desabilitado */
.btn-withdraw:disabled {
    background: linear-gradient(180deg, #555 0%, #333 100%);
    color: #888;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

.msg-erro-saque {
    color: #ef4444;
    font-size: 0.8rem;
    text-align: center;
    margin-top: 10px;
    font-weight: 700;
}

    .btn-withdraw:active { transform: scale(0.96); }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.7rem;
      color: #555;
    }

    /* Animação de entrada */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.6s ease forwards; }
  </style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='home.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="topbar-title">Solicitar Levantamento</span>
  </div>

  <div class="balance-card fade-in">
    <span class="balance-label">Saldo Total</span>
    <span class="user-balance balance-amount">0,00 Kzs</span>
    <span class="balance-sub">● Disponível para saque imediato</span>
  </div>

  <div class="content fade-in" style="animation-delay: 0.1s;">
    
<button id="main-withdraw-btn" class="btn-withdraw" onclick="window.location.href='pages/saques/recepcao_de_valores.html'">
    SACAR TUDO AGORA
</button>

    <p style="text-align: center; font-size: 0.7rem; color: #888; margin-top: 15px; line-height: 1.4;">
      Ao clicar em sacar, seus valores serão processados e enviados para a conta que será vinculada.
    </p>
  </div>

  <footer class="footer">
    <p>Segurança Criptografada SSL © Evolium 2026</p>
  </footer>
</div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
    const btnSacar = document.querySelector('.btn-withdraw');
    const container = document.querySelector('.content');
    
    // 1. Recupera o saldo do localStorage
    const saldoSalvo = localStorage.getItem('user_balance') || "0";
    const saldoNumerico = parseFloat(saldoSalvo);

    // 2. Verifica a condição de segurança (Mínimo 8.000 Kz)
    if (saldoNumerico < 8000) {
        // Desabilita o clique e o botão
        btnSacar.disabled = true;
        btnSacar.onclick = null; 
        
        // Altera o texto para informar o motivo
        btnSacar.textContent = "SALDO INSUFICIENTE";

        // Adiciona uma mensagem de aviso abaixo do botão
        const msgErro = document.createElement('p');
        msgErro.className = 'msg-erro-saque';
        msgErro.textContent = "O valor mínimo para levantamento é de 8.000,00 Kzs.";
        btnSacar.parentNode.insertBefore(msgErro, btnSacar.nextSibling);
    }
});
  </script>
  <script type="text/javascript" src="assets/js/index.js" defer></script>
  <script type="text/javascript" src="assets/js/saques.js" defer></script>
</body>
</html>
