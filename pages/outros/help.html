<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeo – Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: 'Nunito Sans', sans-serif;
    }

    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #cc0000;
    }

    .phone::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .phone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(180,0,0,0.1) 0%, rgba(70,0,0,0.55) 100%);
      z-index: 1;
    }

    /* ── Top bar ── */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: clamp(14px,3vh,22px) 18px 10px;
      animation: fadeUp 0.5s ease both;
    }

    .back-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.28); }
    .back-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; }

    .topbar-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.25);
      flex: 1;
    }

    /* ── Video card ── */
    .video-card {
      position: relative;
      z-index: 2;
      margin: 6px 16px 0;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #000;
      animation: fadeUp 0.5s ease 0.1s both;
      /* 16:9 aspect ratio */
      aspect-ratio: 16 / 9;
      width: calc(100% - 32px);
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Info card ── */
    .info-card {
      position: relative;
      z-index: 2;
      margin: 12px 16px 0;
      background: rgba(255,255,255,0.97);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeUp 0.5s ease 0.18s both;
    }

    .info-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      color: #222;
      line-height: 1.3;
    }

    .info-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: #888;
    }

    .meta-chip svg {
      width: 14px; height: 14px;
      stroke: #bbb;
      fill: none;
      stroke-width: 2;
    }

    .divider {
      height: 1px;
      background: #f0f0f0;
    }

    .info-desc {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      color: #888;
      line-height: 1.55;
    }

    /* ── CTA button ── */
    .btn-cta {
      position: relative;
      z-index: 2;
      margin: 12px 16px 0;
      width: calc(100% - 32px);
      padding: clamp(14px,2.5vh,18px);
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #f5c842 0%, #d4a010 100%);
      color: #7a3500;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(0.95rem,2.5vh,1.1rem);
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #a07000, 0 6px 20px rgba(212,160,16,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: fadeUp 0.5s ease 0.25s both;
    }

    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #a07000, 0 10px 26px rgba(212,160,16,0.5);
    }

    .btn-cta:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #a07000, 0 4px 12px rgba(212,160,16,0.3);
    }

    .btn-cta svg { width: 18px; height: 18px; stroke: #7a3500; fill: none; stroke-width: 2.5; }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 2;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 0.73rem;
      padding: 10px 0 clamp(8px,1.5vh,14px);
      margin-top: auto;
      animation: fadeUp 0.5s ease 0.3s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="phone">

  <!-- Top bar -->
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="topbar-title">Como Funciona</span>
  </div>

  <!-- Video -->
  <div class="video-card">
    <iframe
      src="https://player-vz-6aa90485-a47.tv.pandavideo.com/embed/?v=f68d20a9-987a-4a4f-a148-eae17b1ac613"
      allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
      fetchpriority="high">
    </iframe>
  </div>

  <!-- Info card -->
  <div class="info-card">
    <span class="info-title">Sou Angolano, Conheço Angola 🇦🇴</span>
    <div class="info-meta">
      <span class="meta-chip">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Assiste até ao fim
      </span>
      <span class="meta-chip">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Tutorial completo
      </span>
    </div>
    <div class="divider"></div>
    <p class="info-desc">
      Aprende como funciona a plataforma, como ganhar pontos e como levantar os teus prémios em Kwanzas.
    </p>
  </div>

  <p class="footer">Desenvolvido por:&nbsp; Evolium</p>
</div>
</body>
</html>
