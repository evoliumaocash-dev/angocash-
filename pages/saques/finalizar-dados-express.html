<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finalizar Saque – Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Reset e Variáveis */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary-gold: linear-gradient(180deg, #f5c842 0%, #e8a820 35%, #d4861a 65%, #c07010 100%);
      --gold-shadow: #8a4a00;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Nunito Sans', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container Principal (Simulando App Mobile) */
    .phone-container {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #cc0000; /* Fallback */
    }

    /* Fundo com textura e overlay igual à Home */
    .phone-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('../../assets/img/bg.jpg'); /* Substitua pelo seu caminho de imagem */
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .phone-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(180,0,0,0.1) 0%, rgba(60,0,0,0.7) 100%);
      z-index: 1;
    }

    /* Conteúdo */
    .content {
      position: relative;
      z-index: 2;
      flex: 1;
      padding: 40px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Ícone de Segurança */
    .header-icon {
      width: 90px;
      height: 90px;
      background: #f5c842;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 4px solid rgba(255,255,255,0.4);
      transform: rotate(-5deg);
    }

    h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 4px 10px rgba(0,0,0,0.6);
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    /* Input Card */
    .input-box {
      width: 100%;
      background: rgba(0,0,0,0.3);
      padding: 25px;
      border-radius: 25px;
      border: 2px solid rgba(255,255,255,0.1);
      margin-bottom: 25px;
    }

    .label-text {
      color: #ffd700;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      display: block;
    }

    .custom-input {
      width: 100%;
      background: #fff;
      border: none;
      border-radius: 15px;
      padding: 18px;
      color: #333;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      text-align: center;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
      outline: none;
    }

    /* Card de Resumo */
    .summary-card {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 40px;
      border: 1px dashed rgba(255,255,255,0.2);
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #eee;
    }

    .summary-line .value {
      font-weight: 800;
      color: #fff;
    }

    .summary-line .free {
      color: #4ade80; /* Verde neon para isenção */
      font-weight: 900;
    }

    /* Botão 3D Dourado */
    .btn-withdraw {
      width: 100%;
      padding: 24px;
      border: none;
      border-radius: 25px;
      background: var(--primary-gold);
      color: #7a2800;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--gold-shadow), 0 15px 30px rgba(0,0,0,0.5);
      transition: all 0.1s;
      position: relative;
    }

    .btn-withdraw:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 var(--gold-shadow);
    }

    /* Erro de validação */
    .error-msg {
      color: #ff4d4d;
      font-size: 0.75rem;
      font-weight: 800;
      margin-top: 8px;
      display: none;
      text-align: left;
      padding-left: 5px;
    }
    .error-msg.show { display: block; }
    .custom-input.invalid { border: 3px solid #ff4d4d; }

    /* Animação suave */
    .fade-up {
      animation: fadeUp 0.6s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Rodapé Informativo */
    .secure-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.6;
      font-size: 0.7rem;
      color: white;
    }
  </style>
</head>
<body>

<div class="phone-container">
  <div class="content">
    
    <!-- Ícone decorativo -->
    <div class="header-icon fade-up">
      <svg width="45" height="45" viewBox="0 0 24 24" fill="#7a2800">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
    </div>

    <h2 class="fade-up" style="animation-delay: 0.1s;">Finalizar Dados</h2>

    <!-- Grupo de Input -->
    <div class="input-box fade-up" style="animation-delay: 0.2s;">
      <span class="label-text">Digite o seu Número:</span>
      <input type="text" id="telefone" class="custom-input" placeholder="9XXXXXXXX" maxlength="9" inputmode="numeric">
      <span class="error-msg" id="errTelefone">&#9888; Introduza um número válido com 9 dígitos (começa por 9)</span>
    </div>

    <!-- Resumo -->
    <div class="summary-card fade-up" style="animation-delay: 0.3s;">
      <div class="summary-line">
        <span>Valor do Saque:</span>
        <span class="user-balance value">0.00 Kz</span>
      </div>
    </div>

    <!-- Botão de Ação -->
    <button class="btn-withdraw fade-up" style="animation-delay: 0.4s;" onclick="confirmarSaque()">
      Confirmar Saque
    </button>

    <!-- Footer Seguro -->
    <div class="secure-footer fade-up" style="animation-delay: 0.5s;">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      Conexão segura via Banco Nacional de Angola
    </div>

  </div>
</div>
<script>
  const telefoneInput = document.getElementById('telefone');
  const errTelefone = document.getElementById('errTelefone');

  // Aceita apenas dígitos
  telefoneInput.addEventListener('input', function () {
    this.value = this.value.replace(/[^0-9]/g, '');
    // Remove estado de erro ao digitar
    this.classList.remove('invalid');
    errTelefone.classList.remove('show');
  });

  function validarTelefone(num) {
    // Angola: 9 dígitos, começa obrigatoriamente com 9
    return /^9\d{8}$/.test(num);
  }

  function confirmarSaque() {
    const num = telefoneInput.value.trim();
    let valido = true;

    if (!validarTelefone(num)) {
      telefoneInput.classList.add('invalid');
      errTelefone.classList.add('show');
      telefoneInput.focus();
      valido = false;
    }

    if (valido) {
      location.href = 'levantamento-solicitado.html';
    }
  }
</script>


<script src="../../assets/js/index.js" defer></script>
</body>
</html>
