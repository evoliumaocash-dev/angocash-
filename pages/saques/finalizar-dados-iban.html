<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finalizar Dados – Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: 'Nunito Sans', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #cc0000;
    }

    .phone::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('../..assets/img/bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .phone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(180,0,0,0.1) 0%, rgba(70,0,0,0.55) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      flex: 1;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .icon-lock {
      width: 80px;
      height: 80px;
      background: #f5c842;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border: 4px solid rgba(255,255,255,0.3);
    }

    h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 25px;
    }

    .label {
      color: rgba(255,255,255,0.8);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: block;
    }

    .iban-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
    }

    .iban-input:focus { border-color: #f5c842; }
    .iban-input.invalid { border-color: #ff4d4d !important; }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 8px;
      display: none;
      text-align: left;
    }
    .error-msg.show { display: block; }

    .summary-card {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 30px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
    }

    .summary-row b { color: #fff; font-weight: 800; }
    .summary-row .tax-free { color: #00ff88; }

    .btn-confirm {
      width: 100%;
      padding: 22px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(180deg, #f5c842 0%, #e8a820 35%, #d4861a 65%, #c07010 100%);
      color: #7a2800;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 0 #8a4a00, 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s;
      animation: pulseBtn 2s infinite;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .btn-confirm:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8a4a00;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .animate-up { animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="content">
    <div class="icon-lock animate-up">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#7a2800">
        <path d="M12 17a2 2 0 100-4 2 2 0 000 4z"/>
        <path d="M18 8h-1V6a5 5 0 00-10 0v2H6a3 3 0 00-3 3v8a3 3 0 003 3h12a3 3 0 003-3v-8a3 3 0 00-3-3zM9 6a3 3 0 016 0v2H9V6zm10 13a1 1 0 01-1 1H6a1 1 0 01-1-1v-8a1 1 0 011-1h12a1 1 0 011 1v8z"/>
      </svg>
    </div>

    <h2 class="animate-up" style="animation-delay: 0.1s">Finalizar Dados</h2>

    <div class="input-group animate-up" style="animation-delay: 0.2s">
      <label class="label">Digite seu IBAN (25 dígitos)</label>
      <input type="text" id="ibanInput" class="iban-input" placeholder="AO06 0000..." maxlength="32">
      <span class="error-msg" id="errIban">&#9888; IBAN inválido. Deve começar com AO06 e ter 25 caracteres</span>
    </div>

    <div class="summary-card animate-up" style="animation-delay: 0.3s">
      <div class="summary-row">
        <span>Resumo da Operação</span>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 10px 0;"></div>
      <div class="summary-row">
        <span>Valor Bruto:</span>
        <b class="user-balance">00.00 Kz</b>
      </div>
    </div>

    <button class="btn-confirm animate-up" style="animation-delay: 0.4s" onclick="confirmarIBAN()">
      Confirmar Saque Agora
    </button>
  </div>
</div>

<!-- ✅ Script no final do body — DOM já existe aqui -->
<script src="../../assets/js/index.js" defer></script>
<script>
  const ibanInput = document.getElementById('ibanInput');
  const errIban   = document.getElementById('errIban');

  ibanInput.addEventListener('input', function () {
    // Remove tudo que não seja alfanumérico e converte para maiúsculas
    let raw = this.value.replace(/[^A-Z0-9]/gi, '').toUpperCase();
    // Formata visualmente em grupos de 4 separados por espaço
    this.value = raw.replace(/(.{4})/g, '$1 ').trim();
    // Limpa estado de erro enquanto o utilizador escreve
    this.classList.remove('invalid');
    errIban.classList.remove('show');
  });

  function validarIBAN(val) {
    // Remove espaços e normaliza para maiúsculas
    const raw = val.replace(/\s/g, '').toUpperCase();
    // IBAN Angola: AO + 2 check digits + 25 dígitos numéricos = 25 chars
    return /^AO\d{23}$/.test(raw);
  }

  function confirmarIBAN() {
    const val = ibanInput.value.trim();
    if (!validarIBAN(val)) {
      ibanInput.classList.add('invalid');
      errIban.classList.add('show');
      ibanInput.focus();
      return;
    }
    location.href = 'levantamento-solicitado2.html';
  }
</script>
</body>
</html>
