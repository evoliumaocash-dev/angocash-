<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desafio - Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        background: #111; 
        font-family: 'Nunito Sans', sans-serif; 
        overflow: hidden; 
    }

    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      background: #cc0000 url('../../assets/img/bg.jpg') center/cover;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .phone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(180,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
      z-index: -1;
    }

    .header {
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      z-index: 2;
    }

    .balance-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 15px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .game-content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .question-card {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .question-text { color: #333; font-size: 1.1rem; font-weight: 800; margin-bottom: 25px; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }

    .opt-btn {
      padding: 15px;
      border: 2px solid #eee;
      border-radius: 15px;
      background: #f9f9f9;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .correct { background: #22c55e !important; color: white; border-color: #16a34a; }
    .wrong { background: #ef4444 !important; color: white; border-color: #b91c1c; }

    .mascote-small { width: 70px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* Modal de Fim de Jogo */
    #end-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 10;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      width: 100%;
    }

    .modal-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      border: none;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-withdraw { background: #22c55e; color: white; }
    .btn-boost { background: #facc15; color: #000; }
  </style>
</head>
<body>

<div class="phone">
  <div class="header">
    <button onclick="location.href='../../home.html'" style="background:none; border:none; color:white; font-weight:900;">✖ SAIR</button>
    <div class="balance-box">💰 <span id="balance-display">0,00</span> Kz</div>
  </div>

  <div class="game-content">
    <img src="../../assets/img/mascote_3.png" class="mascote-small">
    <div class="question-card">
      <p id="question-count" style="color: #cc0000; font-weight: 800; font-size: 0.8rem; margin-bottom: 10px;"></p>
      <p id="question-text" class="question-text">Preparando...</p>
      <div class="options-grid" id="options-container"></div>
    </div>
  </div>

  <!-- Modal de Decisão Final -->
  <div id="end-modal">
    <div class="modal-content">
      <h2 style="color: #333; margin-bottom: 10px;">Parabéns! 🇦🇴</h2>
      <p id="final-balance-text" style="font-size: 1.2rem; font-weight: 700; color: #cc0000;"></p>
      <p style="margin: 15px 0; color: #666; font-size: 0.9rem;">O que deseja fazer com o seu saldo acumulado?</p>
      
      <button class="modal-btn btn-withdraw" onclick="action('sacar')">SACAR AGORA</button>
      <button class="modal-btn btn-boost" onclick="action('turbinar')">TURBINAR SALDO</button>
    </div>
  </div>
</div>

<script>
  const FLOW_CONFIG = {
    "jogo.html": { level: 1, next: "turbinar.html" },
    "turbinar.html": { level: 2, next: "turbinar2.html" },
    "turbinar2.html": { level: 3, next: "../../sacar.html" }
  };

  const currentPage = window.location.pathname.split("/").pop() || 'jogo.html';
  const pageConfig = FLOW_CONFIG[currentPage];

  // SEMPRE reseta tudo ao iniciar o jogo (nível 1)
  localStorage.setItem('user_balance', '0');
  localStorage.setItem('game_progress', '1');

  // Bloqueia botão "Voltar" do navegador
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };

  // Só libera próximo nível, sem redirecionar
  function liberarProximoNivel() {
    if (!pageConfig) return;
    const proximoLevel = pageConfig.level + 1;
    localStorage.setItem('game_progress', proximoLevel.toString());
  }

  const quizData = [
    { q: "Qual é o ponto mais alto de Angola?", a: ["Morro do Moco", "Serra da Chela", "Monte Belo"], c: 0 },
    { q: "Qual destes rios faz fronteira com a Namíbia?", a: ["Rio Kwanza", "Rio Cunene", "Rio Queve"], c: 1 },
    { q: "Quem foi o primeiro presidente de Angola?", a: ["Jonas Savimbi", "Agostinho Neto", "José Eduardo"], c: 1 },
    { q: "A 'Festa do Mar' é celebrada em qual cidade?", a: ["Luanda", "Namibe", "Lobito"], c: 1 },
    { q: "Qual é a árvore nacional de Angola?", a: ["Embondeiro", "Palmeira", "Acácia"], c: 0 },
    { q: "Qual província é conhecida como a 'Terras do Progresso'?", a: ["Huambo", "Malanje", "Lunda Sul"], c: 1 },
    { q: "Qual o animal que aparece no símbolo da seleção nacional de futebol?", a: ["Leão", "Palanca Negra", "Elefante"], c: 1 },
    { q: "O deserto do Namibe é considerado o mais...", a: ["Quente", "Antigo do mundo", "Extenso"], c: 1 },
    { q: "Qual é a principal riqueza mineral extraída em Catoca?", a: ["Petróleo", "Diamantes", "Ouro"], c: 1 },
    { q: "Qual é o prato que utiliza farinha de milho ou mandioca?", a: ["Funge", "Calulu", "Mufete"], c: 0 }
  ];

  let currentQuestion = 0;
  let userBalance = parseFloat(localStorage.getItem('user_balance')) || 0.00;

  function updateDisplay() {
    document.getElementById('balance-display').textContent = userBalance.toLocaleString('pt-AO', { minimumFractionDigits: 2 });
    localStorage.setItem('user_balance', userBalance);
  }

  function loadQuestion() {
    const data = quizData[currentQuestion];
    document.getElementById('question-count').textContent = `PERGUNTA ${currentQuestion + 1} DE 10`;
    document.getElementById('question-text').textContent = data.q;
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    data.a.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(index, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(index, btn) {
    const correctIndex = quizData[currentQuestion].c;
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');

    if (index === correctIndex) {
      btn.classList.add('correct');
      userBalance += 3500.00;
      updateDisplay();
    } else {
      btn.classList.add('wrong');
      allBtns[correctIndex].classList.add('correct');
    }

    setTimeout(() => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showEndModal();
      }
    }, 1200);
  }

  function showEndModal() {
    document.getElementById('final-balance-text').textContent = userBalance.toLocaleString('pt-AO') + " Kzs";
    document.getElementById('end-modal').style.display = 'flex';
    // REMOVIDO: completarNivel() daqui
  }

  function action(type) {
    liberarProximoNivel(); // Libera nível 2 só quando clica

    if (type === 'sacar') {
      window.location.href = '../../sacar.html';
    } else {
      window.location.href = pageConfig.next; // vai pra turbinar.html
    }
  }

  updateDisplay();
  loadQuestion();
</script></body>
</html>
