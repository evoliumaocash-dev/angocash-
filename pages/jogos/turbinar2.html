<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nível Máximo - Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Estilos idênticos ao jogo.html com efeito dourado extra */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; font-family: 'Nunito Sans', sans-serif; overflow: hidden; }
    .phone { width: min(390px, 100vw); height: min(844px, 100vh); position: relative; background: #000 url('../../assets/img/bg.jpg') center/cover; display: flex; flex-direction: column; z-index: 1; }
    .phone::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: -1; }
    .header { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
    .balance-box { background: linear-gradient(45deg, #f5c842, #e8a820); padding: 10px 20px; border-radius: 12px; color: #000; font-weight: 900; box-shadow: 0 0 15px rgba(245, 200, 66, 0.5); }
    .game-content { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .question-card { background: white; border-radius: 25px; padding: 30px 20px; width: 100%; border: 3px solid #f5c842; }
    .question-text { color: #333; font-size: 1.1rem; font-weight: 800; margin-bottom: 25px; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .opt-btn { padding: 15px; border: 2px solid #eee; border-radius: 15px; background: #f9f9f9; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .correct { background: #22c55e !important; color: white; }
    .wrong { background: #ef4444 !important; color: white; }
    #end-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 10; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 100%; }
    .final-btn { display: block; width: 100%; padding: 20px; margin-top: 15px; border-radius: 12px; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; background: #22c55e; color: white; }
  </style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div style="color: #f5c842; font-weight: 900;">NÍVEL MÁXIMO 🏆</div>
    <div class="balance-box">💰 <span id="balance-display">0,00</span> Kz</div>
  </div>

  <div class="game-content">
    <div class="question-card">
      <p id="question-count" style="color: #666; font-weight: 800; font-size: 0.8rem; margin-bottom: 10px;"></p>
      <p id="question-text" class="question-text">Carregando Desafio Final...</p>
      <div class="options-grid" id="options-container"></div>
    </div>
  </div>

  <div id="end-modal">
    <div class="modal-content">
      <div style="font-size: 3rem;">💰</div>
      <h2 style="color: #333;">SALDO MÁXIMO ATINGIDO!</h2>
      <p id="final-balance-text" style="font-size: 1.8rem; font-weight: 900; color: #22c55e; margin: 15px 0;"></p>
      <p style="color: #666; margin-bottom: 20px;">Você provou ser um verdadeiro Angolano! O seu levantamento prioritário está disponível.</p>
      <button class="final-btn" onclick="location.href='../../sacar.html'">SACAR TODO DINHEIRO</button>
    </div>
  </div>
</div>

<script>
  // Configuração de Segurança de Fluxo
  const FLOW_CONFIG = {
    "jogo.html": { level: 1, next: "turbinar.html" },
    "turbinar.html": { level: 2, next: "turbinar2.html" },
    "turbinar2.html": { level: 3, next: "sacar.html" }
  };

  const currentPage = window.location.pathname.split("/").pop() || 'turbinar2.html';
  const pageConfig = FLOW_CONFIG[currentPage];
  const userLevel = parseInt(localStorage.getItem('game_progress')) || 1;

  // 1. Impede pular etapas: Se o nível da página é maior que o progresso do user
  if (pageConfig && pageConfig.level > userLevel) {
    alert("Conclua a fase anterior primeiro!");
    window.location.replace("home.html");
  }

  // 2. Impede voltar: Se o progresso do user já passou desta página
  if (pageConfig && userLevel > pageConfig.level) {
    window.location.replace(pageConfig.next);
  }

  // 3. Bloqueia o botão "Voltar" do navegador
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };
  const quizData = [
    { q: "Qual é a extensão aproximada da costa marítima de Angola?", a: ["1.200 km", "1.650 km", "2.000 km"], c: 1 },
    { q: "Em que ano a Rainha Ginga faleceu?", a: ["1663", "1600", "1702"], c: 0 },
    { q: "Qual província é a maior produtora de milho em Angola?", a: ["Huambo", "Cuanza Sul", "Bié"], c: 0 },
    { q: "O Parque Nacional da Quiçama localiza-se em qual província?", a: ["Luanda", "Bengo", "Cuanza Norte"], c: 0 },
    { q: "Qual é o mineral mais exportado por Angola depois do petróleo?", a: ["Ouro", "Diamantes", "Ferro"], c: 1 },
    { q: "Qual destes é um deserto localizado em Angola?", a: ["Namibe", "Saara", "Kalahari"], c: 0 },
    { q: "A 'Fenda da Tundavala' é um monumento natural em qual cidade?", a: ["Lubango", "Menongue", "Kuito"], c: 0 },
    { q: "Como se chama a maior ilha de Angola?", a: ["Ilha do Mussulo", "Ilha de Luanda", "Ilha dos Tigres"], c: 2 },
    { q: "Qual é a língua nacional mais falada em Angola?", a: ["Umbundu", "Kimbundu", "Cokwe"], c: 0 },
    { q: "A paz definitiva em Angola foi assinada em qual data?", a: ["4 de Abril de 2002", "11 de Novembro de 1975", "25 de Dezembro de 1999"], c: 0 }
  ];

  let currentQuestion = 0;
  let userBalance = parseFloat(localStorage.getItem('user_balance')) || 0;

  function updateDisplay() {
    document.getElementById('balance-display').textContent = userBalance.toLocaleString('pt-AO', { minimumFractionDigits: 2 });
    localStorage.setItem('user_balance', userBalance);
  }

  function loadQuestion() {
    const data = quizData[currentQuestion];
    document.getElementById('question-count').textContent = `FINAL: PERGUNTA ${currentQuestion + 1} DE 10`;
    document.getElementById('question-text').textContent = data.q;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    data.a.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(index, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(index, btn) {
    const correctIndex = quizData[currentQuestion].c;
    document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');
    if (index === correctIndex) {
      btn.classList.add('correct');
      userBalance += 25000.00;
      updateDisplay();
    } else {
      btn.classList.add('wrong');
      document.querySelectorAll('.opt-btn')[correctIndex].classList.add('correct');
    }
    setTimeout(() => {
      currentQuestion++;
      if (currentQuestion < quizData.length) loadQuestion();
      else showEndModal();
    }, 1200);
  }

  function showEndModal() {
    document.getElementById('final-balance-text').textContent = userBalance.toLocaleString('pt-AO') + " Kzs";
    document.getElementById('end-modal').style.display = 'flex';
  }

  updateDisplay();
  loadQuestion();
</script>
</body>
</html>
