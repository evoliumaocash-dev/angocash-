<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home – Sou Angolano</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: 'Nunito Sans', sans-serif;
    }

    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #cc0000;
    }

    /* Background texture */
    .phone::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('assets/img/bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* Radial vignette */
    .phone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(180,0,0,0.1) 0%, rgba(70,0,0,0.55) 100%);
      z-index: 1;
    }

    /* ── Top bar ── */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(14px,3vh,22px) 18px 10px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #f5c842;
      overflow: hidden;
      border: 2.5px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-text { display: flex; flex-direction: column; }

    .user-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .edit-icon {
      width: 13px; height: 13px;
      opacity: 0.8;
    }

    .user-balance {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.85);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-actions svg {
      width: 22px; height: 22px;
      stroke: rgba(255,255,255,0.85);
      fill: none;
      stroke-width: 2;
      cursor: pointer;
      transition: stroke 0.2s;
    }

    .topbar-actions svg:hover { stroke: #fff; }

    /* ── Hero section ── */
    .hero {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding: clamp(4px,1vh,10px) 24px clamp(4px,1vh,10px) 8px;
      gap: 4px;
    }

    .hero-mascot {
      width: clamp(110px, 28vw, 140px);
      flex-shrink: 0;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .hero-text {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(1.35rem, 5vw, 1.75rem);
      color: #fff;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* ── Menu buttons ── */
    .menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vh, 16px);
      padding: clamp(8px,2vh,18px) 20px;
      flex: 1;
      justify-content: center;
    }

    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: clamp(16px, 3vh, 22px) 24px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      letter-spacing: 1px;
      color: #7a2800;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;

      background: linear-gradient(180deg,
        #f5c842 0%,
        #e8a820 35%,
        #d4861a 65%,
        #c07010 100%
      );
      box-shadow:
        0 6px 0 #8a4a00,
        0 8px 20px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 50%);
      pointer-events: none;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 0 #8a4a00,
        0 12px 28px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .menu-btn:active {
      transform: translateY(3px);
      box-shadow:
        0 2px 0 #8a4a00,
        0 4px 12px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .menu-btn .btn-icon {
      width: clamp(26px, 5vw, 32px);
      height: clamp(26px, 5vw, 32px);
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
    }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 2;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 0.75rem;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 600;
      padding-bottom: clamp(10px, 2vh, 18px);
    }

    /* ── Botão Flutuante de Ajuda ── */
    .btn-help-float {
      position: fixed;
      bottom: 25px;
      right: 20px;
      background: #25d366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 9999;
      cursor: pointer;
      text-decoration: none;
      animation: pulse-help 2s infinite;
    }

    .btn-help-float svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    @keyframes pulse-help {
      0%   { transform: scale(1);   box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70%  { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
      100% { transform: scale(1);   box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    /* Animations */
    .topbar  { animation: fadeUp 0.5s ease both; }
    .hero    { animation: fadeUp 0.5s ease 0.1s both; }
    .menu    { animation: fadeUp 0.5s ease 0.2s both; }
    .footer  { animation: fadeUp 0.5s ease 0.3s both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- Botão Flutuante de Ajuda -->
<a href="pages/outros/help.html" class="btn-help-float" id="helpButton" target="_blank" title="Precisa de ajuda?">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
  </svg>
</a>

<div class="phone">
  
  <!-- Hero -->
  <div class="hero">
    <img class="hero-mascot" src="assets/img/mascote_3.png" alt="Mascote" />
    <span class="hero-text">Mostre que<br>conheces<br>Angola</span>
  </div>

  <!-- Menu -->
  <div class="menu">

    <button class="menu-btn" onclick="window.location.href='pages/jogos/jogo.html'">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#7a2800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="4"/>
        <path d="M6 12h4M8 10v4"/>
        <circle cx="16" cy="11" r="1" fill="#7a2800"/>
        <circle cx="18" cy="13" r="1" fill="#7a2800"/>
      </svg>
      JOGAR
    </button>

    <button class="menu-btn" onclick="window.location.href='sacar.html'">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#7a2800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8v8M8 12l4 4 4-4"/>
      </svg>
      SACAR DINHEIRO
    </button>

    <button class="menu-btn" onclick="window.location.href='pages/outros/ranking.html'">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#7a2800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15c-3.87 0-7-3.13-7-7V4h14v4c0 3.87-3.13 7-7 7z"/>
        <path d="M8.21 15.89A4 4 0 0112 20a4 4 0 013.79-4.11"/>
        <line x1="8" y1="20" x2="16" y2="20"/>
        <path d="M5 8H2M19 8h3"/>
      </svg>
      RANKING
    </button>

  </div>

  <p class="footer">Desenvolvido por:&nbsp; <a href="https://evolium.ao/home" target="_blank" style="text-decoration:none; color: #fff;">Evolium</a></p>
</div>

<script>
  // Faz o botão de ajuda aparecer após 2,5 segundos
  window.onload = function () {
    setTimeout(function () {
      var btn = document.getElementById('helpButton');
      btn.style.display = 'flex';
    }, 1500);
  };
</script>

</body>
</html>
